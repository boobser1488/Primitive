[package]
name = "primitive_shared"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared world model, protocol and lighting for Primitive"
publish = false

# Explicit target -- see the note in primitive_server/Cargo.toml.
[lib]
name = "primitive_shared"
path = "src/lib.rs"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
bincode = { workspace = true }
noise = { workspace = true }

# Tests only, and only one of them: `worldgen`'s map dump writes a
# picture of the world so terrain can be *looked* at. Nothing a check
# can assert tells you that a coastline reads as a coastline.
[dev-dependencies]
image = { version = "0.24", default-features = false, features = ["png"] }
