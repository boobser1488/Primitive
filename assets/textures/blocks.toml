copper_knife = "tools/copper_knife.png"
copper_axe = "tools/copper_axe.png"
copper_pickaxe = "tools/copper_pickaxe.png"
bronze_knife = "tools/bronze_knife.png"
bronze_axe = "tools/bronze_axe.png"
bronze_pickaxe = "tools/bronze_pickaxe.png"
iron_knife = "tools/iron_knife.png"
iron_axe = "tools/iron_axe.png"
iron_pickaxe = "tools/iron_pickaxe.png"

# ---- 1.9: the copper bench ----
#
# Four castings and the two tools copper had no version of. Hand-drawn,
# unlike the six generated rows above them -- which is why the copper axe
# and pick are no longer in `gen_placeholder_textures`'s `METAL_TOOLS`:
# a table naming a file that program is not the author of is a table that
# would destroy artwork on a `--force` run.
#
# A head is an item and so is a hafted tool; none of these is ever a face
# of anything, so the transparent texels round them are safe. See the
# note on the wool block for what happens when that is not true.
copper_axe_head = "tools/copper_axe_head.png"
copper_pick_head = "tools/copper_pick_head.png"
copper_shovel_head = "tools/copper_shovel_head.png"
copper_hoe_head = "tools/copper_hoe_head.png"
copper_shovel = "tools/copper_shovel.png"
copper_hoe = "tools/copper_hoe.png"

# ---- 1.6: the kiln, and what comes out of it ----
#
# Four pictures for two blocks, and the same split the campfire uses:
# what tells you a kiln is alight is the stoke hole and the flue, so
# those are the two faces that differ. Unlike the campfire the side
# changes too -- a kiln is a whole cell tall and you feed it from the
# front, so the mouth is on the side where you can see it.
# The mouth is the front and the other three walls are plain daub -- a
# kiln with a stoke hole on every side is a box with four mouths and no
# back. See the note on the chest above for how the front is chosen.
kiln = { top = "fire/kiln_top.png", side = "fire/kiln_side.png", bottom = "fire/kiln_side.png", north = "fire/kiln_front.png" }
kiln_lit = { top = "fire/kiln_lit_top.png", side = "fire/kiln_lit_side.png", bottom = "fire/kiln_side.png", north = "fire/kiln_lit_front.png" }
brick = "pottery/brick.png"
bricks = "pottery/bricks.png"
sandstone_bricks = "terrain/sandstone_bricks.png"

# Not listed above and loaded all the same, like `break.N.png`: the
# animal skins (`hare.png`, `deer.png`, `boar.png`) and the two
# precipitation tiles (`rain.png`, `snow_fall.png`). None of them is a
# block face -- an animal is an entity wearing one texture and the rain
# is a quad standing in front of the camera -- so they have no row here
# and are asked for by name. See the client's `texture::EXTRA_TEXTURES`.

# ---- 1.6: the field ----
#
# The three crop stages are cross-shaped, like every other plant: one
# picture drawn on two crossed planes. The seed and the first stage are
# the same block -- see `types::BLOCK_SEEDS` -- so `seeds.png` is both
# what a player carries and what has just been planted.
hoe = "tools/hoe.png"
# The planted picture is seven lit pixels -- one sprout, which is what a
# just-sown cell looks like and is invisible in a hand. See `ash` above
