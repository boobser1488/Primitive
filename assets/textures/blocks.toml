# layers for eleven plants and their picked states.
fireweed = { top = "plants/fireweed_top.png", side = "plants/fireweed.png" }
cattail = { top = "plants/cattail_top.png", side = "plants/reeds.png" }
# Giant reed: jointed cane under a pale plume. See `types::BLOCK_ARUNDO`.
arundo = { top = "plants/arundo_top.png", side = "plants/arundo.png" }
cane = "plants/cane.png"
nettle = { top = "plants/nettle_top.png", side = "plants/nettle.png" }
bracken = { top = "plants/fern.png", side = "plants/bracken.png" }
bilberry = "plants/bilberry.png"
bilberry_bare = "plants/bilberry_bare.png"
strawberry = "plants/strawberry.png"
strawberry_bare = "plants/strawberry_bare.png"
plantain = "plants/plantain.png"
fern = "plants/fern.png"
sundew = "plants/sundew.png"

# What you carry. Only raw meat and the hide are ever a face of anything --
# a carcass at that stage -- and those name a face apart from the icon.
berries = "food/berries.png"
raw_meat = { all = "food/flesh.png", item = "food/raw_meat.png" }
cooked_meat = "food/cooked_meat.png"
human_flesh = "food/human_flesh.png"
roast_human_flesh = "food/roast_human_flesh.png"
dried_meat = "food/dried_meat.png"
# The larder: salt boiled out of the sea, what it keeps, and what the rack
# then dries. The `_side` pictures are what hangs on the rack.
salt = "food/salt.png"
salted_meat = "food/salted_meat.png"
salted_fish = "food/salted_fish.png"
dried_fish = "food/dried_fish.png"
dried_salted_meat = "food/dried_salted_meat.png"
dried_salted_fish = "food/dried_salted_fish.png"
# A sheep at its hide stage wears this face, and the folded-hide icon
# wrapped round a body read as a picture pasted on, the way raw meat's
