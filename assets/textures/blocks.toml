# Block name (must match primitive_shared::types::ALL_BLOCK_IDS) -> texture.
#
# Two forms are accepted:
#
#   stone = "terrain/stone.png"                       # the same image on all 6 faces
#   grass = { top = "...", side = "...", bottom = "..." }
#
# Per-face keys: top, bottom, side (the 4 vertical faces at once),
# north, south, east, west, and `all` as a catch-all. First match wins in
# the order: the face's own name -> side -> all -> missing-texture
# placeholder. So a block that needs one distinct face doesn't have to
# list all six.
#
# Identical filenames are uploaded once and shared between blocks, so
# reusing dirt.png for grass's underside costs nothing.
#
# Any size PNG works -- it's resized to `resolution` on load. A missing
# or unreadable file falls back to a magenta/black checkerboard and logs
# a warning instead of stopping the game.

# Some names are loaded without being listed here, because they are not
# block faces: `break.0.png` .. `break.4.png` are the damage drawn on a
# block while it is being mined. Transparent everywhere except the
# damage -- alpha is what says "there is a crack here", and the colour
# under it is how much darker that texel makes the block.
#
# They are *multiplied* into the face rather than laid over it, so what
# you see is the block's own texture, its own light and its own fog with
# the damage taken out of it. A black texel is a hole and a mid-grey one
# is a scuff; a white one would do nothing at all. Nothing here can add
# brightness, which is deliberate: damage that glowed in a dark cave was
# the old behaviour and it read as a decal hanging in front of the
# block.

# Paths are relative to this folder, and they are grouped: a block's
# pictures live with the other pictures of their kind. It is one folder
# per *thing in the game* rather than per file type -- `animals/`,
# `tools/`, `fire/` -- because the question anybody opening this folder
# has is "where are the wolf's textures", never "where are the 16x16
# PNGs".
# How big one layer of the texture array is, in texels. Every picture is
# resized to this on load, with nearest neighbour -- so the 16-texel art
# this pack ships is doubled exactly rather than blurred, and a pack
# drawn at 32 is finally shown at 32 instead of being halved.
#
# **Thirty-two, and the reason is the font.** The glyphs share layers
# with each other (see `FontAtlas`), and how many fit is the layer
# divided by an 8x10 cell: at sixteen that is *two*, so 179 characters of
# Latin, Cyrillic and Polish ate 90 of the 256 layers the hardware
# allows -- a third of the atlas, and the reason there was room for
# exactly one more picture in the whole game. At thirty-two it is twelve
# a layer and fifteen layers in total.
#
# The cost is a megabyte of video memory for the whole array. The gain is
# seventy-five layers to draw things in.
resolution = 32

[textures]
grass = { top = "terrain/grass_top.png", side = "terrain/grass_side.png", bottom = "terrain/dirt.png" }
dirt = "terrain/dirt.png"
stone = "terrain/stone.png"
sand = "terrain/sand.png"
snow = "terrain/snow.png"
water = "terrain/water.png"
log = { top = "terrain/log_top.png", bottom = "terrain/log_top.png", side = "terrain/log_side.png" }
leaves = "plants/leaves.png"
# Birch: a second wood, not a variant of the first. See
# `types::BLOCK_BIRCH_LOG` for why that is three ids and three files
# rather than a bit in an id.
birch_log = { top = "terrain/birch_log_top.png", bottom = "terrain/birch_log_top.png", side = "terrain/birch_log_side.png" }
# The experimental trees' pieces: an oak's bark, and the same filenames the
# log already uses, so they cost no layer. The world draws them as posts
# cut from the bark (`mesh::branch_block`); these rows are what a chest
# in the test world shows.
twig = "terrain/log_side.png"
bough = { top = "terrain/log_top.png", bottom = "terrain/log_top.png", side = "terrain/log_side.png" }
# ...and the same pieces standing in a swamp pool (`types::BLOCK_DROWNED_BOUGH`):
# the same bark, the same files, no layer.
drowned_twig = "terrain/log_side.png"
drowned_bough = { top = "terrain/log_top.png", bottom = "terrain/log_top.png", side = "terrain/log_side.png" }
birch_leaves = "plants/birch_leaves.png"
# ---- savanna ----
# The acacia's plate: the oak's picture recoloured grey-green, and left
# untinted -- see `types::BLOCK_ACACIA_LEAVES`. The termite mound: dirt
# recoloured to red ochre -- see `types::BLOCK_TERMITE_MOUND`.
acacia_leaves = "plants/acacia_leaves.png"
termite_mound = "terrain/termite_mound.png"
# The maple: the oak leaf recoloured red-orange, untinted -- see
# `types::BLOCK_MAPLE_LEAVES`.
maple_leaves = "plants/maple_leaves.png"
# Sandy soil: the dirt picture's clods and the sand's fine grain in muted
# khaki-ochre, with three small pebbles -- see `types::BLOCK_SANDY_SOIL`.
sandy_soil = "terrain/sandy_soil.png"
# Dry grass: the tall grass sprite's own silhouette in straw, untinted --
# see `types::BLOCK_DRY_GRASS`.
dry_grass = "plants/dry_grass.png"
# Dry turf: the grass pictures' own grain in straw, the side's soil left as
# it was -- see `types::BLOCK_DRY_TURF`.
dry_turf = { top = "terrain/dry_turf_top.png", side = "terrain/dry_turf_side.png", bottom = "terrain/dirt.png" }
birch_planks = "terrain/birch_planks.png"
glowstone = "terrain/glowstone.png"
planks = "terrain/planks.png"
cobblestone = "terrain/cobblestone.png"
# The cross-shaped plants: one texture, drawn on two crossed planes
# rather than on six faces. See `is_cross` in primitive_shared::types.
tall_grass = "plants/grass_mesh.png"
stick = "plants/stick.png"
# Bait: the three that are things rather than food already in the game.
# See `fishing::Bait`.
worm = "plants/worm.png"
grub = "plants/grub.png"
fishing_fly = "plants/fishing_fly.png"

cactus = { top = "plants/cactus_top.png", bottom = "plants/cactus_top.png", side = "plants/cactus.png" }
# Not a block: fibre is an item, and this is what it looks like lying on
# the ground and in the pack. Opaque on purpose -- see `generate_fiber`.
fiber = "plants/fiber.png"
# A sharpened pole, and slats crossed in a window frame: both sticks, drawn
# from the log's own bark (`types::BLOCK_STAKE`). The stake wears a leaning
# picture in the pack, or a pole stood straight up reads as a stick.
stake = { all = "plants/stake.png", item = "plants/stake_item.png" }
# A pit prop: a post of the same boards it is cut from.
prop = { all = "terrain/planks.png", item = "plants/prop_item.png" }
window_lattice = "plants/window_lattice.png"
# Three leaves fanned from one stalk: what a hand tears out of a crown.
leaf_handful = "plants/leaf_handful.png"

# Loose stones lying on the ground, drawn as a single flat quad rather
# than a cube or a cross. See `is_flat` in primitive_shared::types.
pebble = "terrain/pebble.png"
# Nodules of flint, the same flat shape as a pebble. Dark and angular
# where a pebble is grey and round -- the two lie side by side on a
# stony hillside, so they have to be told apart at a glance.
flint = "tools/flint.png"

# A chest. Its bottom is the planks it is made of -- nobody ever sees it,
# and a face nobody sees is a face not worth a file.
#
# **`north` is the front.** A block that has a front records which way it
# is looking (see `types::Facing`), and the texture loader is handed the
# face *after* that turn -- so the picture listed under `north` is the
# one the player who placed it is looking at. Every side of a chest used
# to carry the latch, which is four chests in a trench coat.
# The chest is a model now (`mesh::Material::Iron`, `models::Prop::Chest`); its
# faces are what the breaking crumbs wear, and the pack shows it whole.
chest = { top = "terrain/chest_top.png", bottom = "terrain/planks.png", side = "terrain/chest_side.png", north = "terrain/chest_front.png", item = "furniture/chest_item.png" }

# A dead player's pack. Two pictures rather than three: the flap is what
# you see from above and the straps are what you see from every side, and
# the underside of a bag standing on the ground is nobody's business --
# it gets the side, because a bag has no boards to fall back on the way
# the chest does.
#
# **Its side is a half-height picture.** A bag fills half its cell (see
# `blocks::BlockDef::thickness`), so the face is drawn half a block tall
# and a sixteen-row image loses every second row of itself at draw time.
# `backpack_side_flat.png` is eight rows, folded down from the drawn one
# by the texture generator -- a hand-drawn eight-row bag should replace
# it the moment somebody draws one. The original stays in the folder and
# is what the flat one is derived from.
backpack = { top = "terrain/backpack_top.png", side = "terrain/backpack_side_flat.png", bottom = "terrain/backpack_side_flat.png", item = "terrain/backpack_item.png" }

# What a death leaves now: the player's own body, and the bones it rots
# into two days later (`types::BLOCK_CORPSE`). The bag above is still
# listed because worlds saved before this have bags standing in them --
# nothing makes a new one.
#
# Two pictures each, on the bag's terms and for the bag's reason: what
# you see of a body on the ground is the *top*, and every flank of it is
# the same low profile. The side is eight rows, not sixteen, because both
# blocks are short ones -- see the note on the backpack above for what a
# sixteen-row picture loses at draw time.
#
# **No `item` picture for either, and that is deliberate.** Neither is
# ever in anybody's hand: they cannot be placed, they drop no block of
# their own, and what comes out of one is what was inside it. A carried
# picture would be a layer of the atlas spent on a thing nobody can
# carry.
corpse = { top = "terrain/corpse_top.png", side = "terrain/corpse_side.png", bottom = "terrain/corpse_side.png" }
# A thing set down by hand (`types::BLOCK_SET_DOWN`). The mesher draws the
# cell as nothing and the frame draws what lies in it; this picture is only
# what the cracks and the dust of taking it back are made of, so it is one
# the atlas already holds and costs no layer.
set_down = "terrain/dirt.png"
remains = { top = "terrain/remains_top.png", side = "terrain/remains_side.png", bottom = "terrain/remains_side.png" }

# What is left of a wood that burned. The same picture on every face: a
# drift of it is a drift whichever way you look at it.
#
# `item` is the one place in this file where a block asks for a picture
# that is not one of its faces, and it is the reason that key exists. A
# tile of ash says what a *floor* of ash looks like; in the pack it is a
# grey square, indistinguishable from stone and from gravel and from
# every other grey square, and a lie about what is in your hand besides.
# The icon is a handful, seen against nothing.
ash = { all = "fire/ash.png", item = "fire/ash_item.png" }

# Riverbank clay and river gravel. Both are the same picture on every
# face for the same reason as ash: a deposit has no up.
clay = "pottery/clay.png"
gravel = "terrain/gravel.png"

# ---- ore and metal ----
#
# The four ores are the same picture on every face: a vein has no up, and
# in any case what you see of one is a face in a wall of stone. Each is
# the stone texture with nodules of its own colour stamped into it, which
# is what makes them readable as ore *at a distance* -- the eye picks out
# a speckle against known rock much faster than it picks out a new grey.
coal_ore = "metal/coal_ore.png"
copper_ore = "metal/copper_ore.png"
tin_ore = "metal/tin_ore.png"
iron_ore = "metal/iron_ore.png"

# The things you carry. None of these is ever a face of anything -- they
# are items -- so the single picture is the icon in the pack and the
# object lying on the ground where it was dropped.
coal = "metal/coal.png"
copper_ingot = "metal/copper_ingot.png"
tin_ingot = "metal/tin_ingot.png"
bronze_ingot = "metal/bronze_ingot.png"
iron_ingot = "metal/iron_ingot.png"

# ---- the stone age ----
#
# The chain that makes a tool, in the order it is made: a flake struck
# off a nodule, a haft whittled with the flake, a head shaped from more
# flint, and the three tools each of those bind into. Every one of them
# shares a palette with `flint.png`, so a pack full of halfway-made
# things reads as one project rather than as seven unrelated items.
#
# The flake is the one of them that is also found lying about -- the
# generator leaves flakes at rock shelters and knapping floors -- so it is
# a flat block like the nodule, and this one picture is both the icon and
# the shard on the ground. As an item it was drawn as a cube in its icon,
# which in a shelter's hearth was a pure black block.
#
# The copper, bronze and iron picks were here and are gone with the
# blocks they drew. Their PNGs are left in this folder unlisted: the
# metals are still in the game and the tools are the obvious next thing,
# and a picture nobody is drawing costs a kilobyte of disk.
flint_flake = "tools/flint_flake.png"
worked_stick = "tools/worked_stick.png"
flint_knife_head = "tools/flint_knife_head.png"
stone_axe_head = "tools/stone_axe_head.png"
stone_pick_head = "tools/stone_pick_head.png"
# ---- 1.9: the torch ----
#
# Three pictures for one object at three points in its life -- see
# `types::BLOCK_TORCH`. The *flame* is not among them: in the hand it is
# the campfire's own six frames drawn over the head, which is why a
# carried fire costs no layer of its own and cannot drift from the fire
# it came from.
torch = "tools/torch.png"
torch_lit = "tools/torch_lit.png"
torch_spent = "tools/torch_spent.png"

flint_knife = "tools/flint_knife.png"
stone_axe = "tools/stone_axe.png"
stone_pickaxe = "tools/stone_pickaxe.png"

# ---- 1.5: what grows, what you eat, and the fire ----
#
# The four plants are cross-shaped, so each is one picture drawn on two
# crossed planes -- see `is_cross`. The berry bush and the picked one
# share everything but the berries, which is what makes a bush you have
