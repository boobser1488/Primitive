hide = { all = "hide/stretched_hide.png", item = "food/hide.png" }

# The fire. Two blocks, three pictures: only the *top* differs between a
# laid fire and a burning one, because from the side you see the same
# ring of stones and the same wood, and what tells you it is alight is
# the light it throws.
# The side is eight rows rather than sixteen, for the reason the bag's
# is: the block is half a cell tall, so half a picture is what actually
# reaches the screen.
#
# `item` on both, and it is not decoration. The side is *four rows* --
# the block fills half its cell, so there is nothing to draw in the
# other twelve -- and an icon is square, so the pack stretched four rows
# of stones into a smear that read as a grey cube. The carried picture
# is a laid hearth seen from the side, on nothing at all, because an
# icon is an object and the eye reads an object by its outline.
campfire = { top = "fire/campfire_top.png", side = "fire/campfire_side.png", bottom = "fire/campfire_side.png", item = "fire/campfire_item.png" }
campfire_lit = { top = "fire/campfire_lit_top.png", side = "fire/campfire_side.png", bottom = "fire/campfire_side.png", item = "fire/campfire_lit_item.png" }

