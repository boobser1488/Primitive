farmland = "terrain/farmland.png"
wheat = "plants/wheat.png"
wheat_ripe = "plants/wheat_ripe.png"
grain = "food/grain.png"
dough = "food/dough.png"
bread = "food/bread.png"

# ---- 1.7: the copper age ----
#
# The pot and the mould are two pictures each, wet and fired, because
# what the kiln does to them is the whole point of the kiln. Wet clay is
# grey and fired clay is terracotta -- the same red as the brick and the
