# entries pointing at one file share one layer (see the atlas note at
# the top of this file), and a leaf with the fruit picked off it *is*
# an ordinary leaf. Only the fruiting one costs a layer, and what it
# costs it for is the thing the player is looking for from across a
# meadow.
apple_leaves = "plants/leaves.png"
apple_leaves_fruit = "plants/apple_leaves.png"
apple = "food/apple.png"
peg = "tools/peg.png"
# Nails are the iron knife's own greys on two drawn nails, and the frame is
# the worked stick's wood and the peg's face laid round a square with a
# joint at each corner. One frame picture for both fastenings, because it
# is one item (`types::BLOCK_FRAME`).
nails = "tools/nails.png"
frame = "tools/frame.png"
# Pegged boards are the wall's own picture with four heads driven into
# it (generated from `planks.png` itself), because the player has to see
# at a glance which joints are fastened and which are waiting to come
# down -- and because a separately drawn board would read as a different
# wood in the same wall.
pegged_planks = "terrain/pegged_planks.png"
pegged_birch_planks = "terrain/pegged_birch_planks.png"

# ---- the fir and the saxaul ----
# Two more woods, each the oak's four pictures repainted in its own colour
# (`gen_placeholder_textures::repaint_wood`): a drawing of grain and rings is
# the same drawing in any timber. Both crowns are untinted -- see
# `types::BLOCK_FIR_NEEDLES` and `types::BLOCK_SAXAUL_LEAVES`.
fir_log = { top = "terrain/fir_log_top.png", bottom = "terrain/fir_log_top.png", side = "terrain/fir_log_side.png" }
fir_needles = "plants/fir_needles.png"
fir_planks = "terrain/fir_planks.png"
pegged_fir_planks = "terrain/pegged_fir_planks.png"
saxaul_log = { top = "terrain/saxaul_log_top.png", bottom = "terrain/saxaul_log_top.png", side = "terrain/saxaul_log_side.png" }
saxaul_leaves = "plants/saxaul_leaves.png"
saxaul_planks = "terrain/saxaul_planks.png"
pegged_saxaul_planks = "terrain/pegged_saxaul_planks.png"

# ---- what an animal gives ----
#
# The four meats and the two skins share the pictures they always had:
# a hare's haunch and a bear's are the same red on a 16x16 icon, and
# the atlas has 256 layers to spend on things the eye can actually tell
# apart (see the note at the top of this file). What tells them apart
# is the name in the pack and the number in `food::nutrition`.
hare_meat = "food/raw_meat.png"
fowl_meat = "food/raw_meat.png"
bear_meat = "food/raw_meat.png"
wolf_meat = "food/raw_meat.png"
pelt = "food/hide.png"
bear_hide = "food/hide.png"
# ...and the four that are genuinely new objects.
feather = "hide/feather.png"
fat = "food/fat.png"
ribs = "food/ribs.png"
roasted_ribs = "food/roasted_ribs.png"
# ---- the sea floor ----
#
# Five things that stand in water, the two stones of a reef, and four
# things a player brings up. The standing ones are sprites -- kelp,
# seagrass and the two corals are crosses, the shell lies flat -- with
# the sea drawn round them by the mesher (see `types::BLOCK_KELP`), so
# their pictures are cut out on a transparent ground like any tuft.
# Kelp and seagrass are untinted: the climate tint is the colour of land
# plants, and a kelp forest the green of the meadow on the shore is not
# kelp. The fish icons are one silhouette in two colours, raw and cooked,
# which is the one case the pack recolours rather than redraws.
kelp = "plants/kelp.png"
kelp_top = "plants/kelp_top.png"
seagrass = "plants/seagrass.png"
sea_fan = "plants/sea_fan.png"
staghorn_coral = "plants/staghorn_coral.png"
brain_coral = "terrain/brain_coral.png"
fire_coral = "terrain/fire_coral.png"
shell = "terrain/shell.png"
kelp_frond = "plants/kelp_frond.png"
dried_kelp = "food/dried_kelp.png"
raw_fish = "food/raw_fish.png"
cooked_fish = "food/cooked_fish.png"
# ---- the palm and the swamp ----
#
# Eight layers. The trunk is oak bark greyed and ringed with the scars of
# old fronds; the fronds are cut-out leaflets on a midrib, and the fruiting
# crown is the same picture with coconuts in it (drawn in, as the apple
# tree's is, so only the fruiting cell costs a second layer over the
# frond). The coconut is a round husked nut rather than the apple
# recoloured -- a different food, a different silhouette. Mud is the peat
# greyed and wet; the lily pad lies flat, notched; the moss hangs from the
# top edge of its tile, because it hangs from the leaf above it.
# Its ends are fibre with no rings, because a palm grows none -- and they
# show only where the trunk ends or was broken through, not on the ledges
# of its lean (`mesh::palm_trunk_block`).
palm_trunk = { top = "plants/palm_top.png", bottom = "plants/palm_top.png", side = "plants/palm_trunk.png" }
palm_fronds = "plants/palm_fronds.png"
palm_coconuts = "plants/palm_coconuts.png"
coconut = "food/coconut.png"
mud = "terrain/mud.png"
# A pat of dung: the mud recoloured darker and browner. See `types::BLOCK_DUNG`.
dung = "soils/dung.png"
lily_pad = "plants/lily_pad.png"
hanging_moss = "plants/hanging_moss.png"
# ---- what a wound is dressed with ----
#
# Three layers, and three different silhouettes rather than one picture
# in three colours: a player reaching into the pack for the thing that
# stops a cut bleeding has to find it by shape at a glance. A roll of
# strip with its loose end hanging off (not the folded bolt of cloth, and
# not the strapped roll of leather), two sticks bound twice, and a round
# pad of fungus half wrapped in a leaf. See `types::BLOCK_BANDAGE`.
bandage = "medicine/bandage.png"
splint = "medicine/splint.png"
poultice = "medicine/poultice.png"

# What is slung over the shoulders (`types::BLOCK_RUCKSACK`).
#
# **The old death bag's own picture, named a second time and costing no
# layer.** Entries naming the same file share a layer (see the atlas
# note in `CLAUDE.md`), so the rucksack is free in the budget that
# matters -- and it should look like the bag, because a player who has
# seen one on the ground in an old world has already learned what the
# shape means.
rucksack = "terrain/backpack_item.png"
# ---- fires in the ground: the pit kiln, the charcoal pit, the firepit ----
#
# Seven new layers for eleven blocks, every one a recolour of a picture
# already here (see `primitive_shared::pit`). Hay is the fibre's hank dried
# gold; the raw brick is the brick in wet clay; fired clay is the clay's
# grain in terracotta, for the pots a burnt kiln leaves. A log pile is four
# of the log's own ends, and alight the same ends with their rings glowing
# (unlit, the world draws it as its logs in their own wood's pictures --
# `mesh::log_pile_block` -- and this picture is only what else asks the row);
# charcoal is the gravel's lumps gone black; a firepit's top is the
# campfire's laid wood with the ring of stones burnt to ash.
#
# **The kiln's stages wear pictures that are already here**, because what
# a pit kiln is made of is already here: clay pots, fibre, oak logs and a
# fire's embers. `mesh::pit_kiln_block` reads each material off the stage's
# own row -- the pot's raw clay off `pit_kiln`'s side and its fired clay off
# its top, the fibre off `pit_kiln_fibre`, the bark and the cut ends off
# `pit_kiln_logs`, the embers off `pit_kiln_lit`'s top -- so a picture
# changed for the fibre or the log changes the kiln with it, and no stage
# costs a layer.
brick_raw = "pottery/brick_raw.png"
pit_kiln = { top = "pottery/fired_clay.png", bottom = "pottery/clay.png", side = "pottery/clay.png" }
pit_kiln_fibre = "plants/fiber.png"
pit_kiln_logs = { top = "terrain/log_top.png", bottom = "terrain/log_top.png", side = "terrain/log_side.png" }
pit_kiln_lit = { top = "fire/campfire_lit_top.png", bottom = "terrain/log_top.png", side = "terrain/log_side.png" }
log_pile = "fire/log_pile.png"
log_pile_lit = "fire/log_pile_lit.png"
charcoal_pile = "fire/charcoal_pile.png"
firepit = { top = "fire/firepit_top.png", side = "fire/campfire_side.png", bottom = "fire/campfire_side.png" }
firepit_lit = { top = "fire/campfire_lit_top.png", side = "fire/campfire_side.png", bottom = "fire/campfire_side.png" }

# ---- fire that got loose, and the standing torch ----
#
# See `primitive_shared::wildfire`. Five pictures for the char and the
# burning, every one a recolour of the log and the planks it was
# (`FIRE_RECOLOURS` in the generator), and one per wood is not needed: char
# is the colour of char whatever tree it was. A burning log's cut ends are
# the charred ends -- the glow is in the grain along its side, and the flame
# stands on its top (`mesh::flame_block`).
burning_log = { top = "fire/charred_log_top.png", bottom = "fire/charred_log_top.png", side = "fire/burning_log_side.png" }
burning_planks = "fire/burning_planks.png"
charred_log = { top = "fire/charred_log_top.png", bottom = "fire/charred_log_top.png", side = "fire/charred_log_side.png" }
charred_planks = "fire/charred_planks.png"
# The standing torch is a model (`mesh::standing_torch_block`): its pole
# wears the oak's bark and costs nothing, and each top's own `all` is its
# wad -- alight, the campfire's embers; burnt out, a knot of char. Only the
# icon is new: the hand torch's picture with its wad gone to resin.
standing_torch = { all = "terrain/log_side.png", item = "tools/standing_torch.png" }
standing_torch_lit = { all = "fire/campfire_lit_top.png", item = "tools/standing_torch.png" }
standing_torch_out = { all = "fire/charred_log_top.png", item = "tools/standing_torch.png" }
# Snow lying on a meadow: the snow's own picture, so no new layer.
snow_cover = "terrain/snow.png"
# Fallen leaves: brown leaves scattered on nothing, so the earth shows
# between them. See `types::BLOCK_LEAF_LITTER`.
leaf_litter = "plants/leaf_litter.png"
resin = "plants/resin.png"

