mould_raw = "pottery/mould_raw.png"
mould = "pottery/mould.png"
iron_bloom = "metal/iron_bloom.png"
bloomery = { top = "fire/bloomery_top.png", side = "fire/bloomery_side.png", bottom = "fire/bloomery_side.png", north = "fire/bloomery_front.png" }
bloomery_lit = { top = "fire/bloomery_lit_top.png", side = "fire/bloomery_lit_side.png", bottom = "fire/bloomery_side.png", north = "fire/bloomery_lit_front.png" }

# ---- 1.8: ice ----
#
# One picture on all six faces, like every other mineral: a frozen pool
# has no up. Opaque in every texel -- what makes ice read as ice here is
# the fractures drawn through it, not seeing the lake bed through the
# block. Light does pass (see `blocks::BlockDef::opacity` for ice); sight
# does not.
ice = "terrain/ice.png"

# ---- 1.7: the tannery, the jug, and what a person wears ----

# Tanned leather, and the frame it was made on. The rack wears one
# picture on all six faces: it is half a block tall and walked over, so
# what a player actually sees is the top of it, and a distinct side
# texture would be four pixels nobody looks at.
leather = "hide/leather.png"
# A fleece off a sheep, and two pictures of it, which is the same split
# `ash` above makes and for a sharper reason.
#
# **A fleece and a bale are not the same shape.** The item picture is a
# blob of wool on nothing: 107 of its 256 texels are opaque, and the
# rest are there so a fleece in the hand is fleece-shaped rather than a
# square. A cube face is drawn without any alpha test -- `fs_solid` has
# no `discard`, that is the whole point of the split between it and
# `fs_cutout` -- so those 149 empty texels came out **black**, and a
# placed bale of wool was a black block with a smear of white on it.
# Reported as exactly that.
#
# So the block gets a picture that covers its face, in the item's own
# three colours so the bale and the fleece are recognisably the same
# material. It tiles with itself, because a wall of wool is one image
# repeated and `AddressMode::Repeat` would otherwise put a seam at every
# block boundary.
#
# Two layers rather than one now. See `MAX_TERRAIN_LAYERS`: the budget
# had 56 free.
wool = { all = "hide/wool_block.png", item = "hide/wool.png" }
# Two racks, two jobs (`rack::Trade`): the rack of two by two is the
# larder, and its icon is what it is for -- an A-frame with strips and a
# fish on the ridge. The hide frame keeps the old rack's picture for its
# faces -- which nobody sees, since it is drawn as a model; they are what its
# chips fly off as -- and naming the same file shares the layer. Its icon is
