berry_bush = "plants/berry_bush.png"
bare_bush = "plants/bare_bush.png"
mushroom = "food/mushroom.png"
reeds = "plants/reeds.png"
flower = "plants/flower.png"
# The wild plants (`types::BLOCK_FIREWEED`). A tall plant is one row for its
# two cells: the lower half and a shoot wear `side`, the upper half `top`
