[workspace]
resolver = "2"
members = [
    "primitive_shared",
    "primitive_modapi",
    "primitive_server",
    "primitive_client",
    # The worked example. In the workspace rather than beside it, so a
    # change to the mod API that breaks a mod breaks the *build* -- an
    # extension point exercised only by the code that implements it is an
    # extension point whose first real user finds the mistakes.
    "mods/greeter",
    # ...and the one that adds something. The greeter proves the
    # boundary works; this one uses it to ship a feature, which is the
    # other half of the same argument -- an extension point whose only
    # user is a demonstration is an extension point nobody has tried to
    # build anything with.
    "mods/flight",
    # ...and the one that calls everything. The greeter proves the
    # boundary works and the flight mod proves it carries a feature;
    # this one is the answer to a hole neither could find. Nine of the
    # events the API declared were never fired by the server and a
    # registered chunk decorator was never run -- every one of which
    # compiled, and every one of which would have been caught the first
    # time somebody on the other side of the boundary said "I subscribed
    # and nothing called me". That is what /sandbox says out loud.
    "mods/sandbox",
    # ...и тот, который приводит с собой чужой язык. Он в рабочем
    # пространстве по той же причине, что и остальные, и **только он
    # один** не тянет за собой ничего снаружи: сам dypt живёт в другом
    # репозитории и открывается на ходу, по имени файла. Иначе сборка
    # игры зависела бы от каталога, которого на чужой машине нет.
    "mods/dypt",
]

[workspace.package]
version = "1.5.1"
edition = "2021"
license = "Apache-2.0 AND LicenseRef-Primitive-Assets"
authors = ["Primitive"]
repository = ""

[workspace.dependencies]
# Not "full". That pulls tokio's filesystem and process modules, which
# nothing here uses -- the world is saved with `std::fs` on a blocking
# task -- and `parking_lot`, whose locks are not on any hot path in a
# game that spends its time meshing chunks. What is left is exactly what
# the three crates reach for; adding a feature is one line when
# something needs it.
tokio = { version = "1", default-features = false, features = [
    "rt-multi-thread", # the runtime the client and server both spawn onto
    "macros",          # #[tokio::main] and select!
    "net",             # TcpListener / TcpStream
    "io-util",         # length-prefixed framing in primitive_shared::net
    "io-std",          # the server console reads stdin
    "sync",            # mpsc, oneshot, watch, Notify
    "time",            # tick intervals and connection timeouts
    "signal",          # Ctrl-C shutdown
] }
# `rc`: `Arc<Chunk>` on the wire, serialised as a plain chunk. See
# `protocol::ServerMessage::ChunkData` for what that saves.
serde = { version = "1", features = ["derive", "rc"] }
bincode = "1"
anyhow = "1"
toml = "0.8"
noise = "0.8"
# The native mod boundary. `libloading` is the portable `dlopen`;
# `ron` is what a mod manifest is written in -- see
# `primitive_modapi::manifest` for why not TOML.
libloading = "0.8"
ron = "0.8"

# Release builds are what players get, so they are tuned for the game
# rather than for build time: one codegen unit and fat LTO across the
# whole workspace, because the hot paths (meshing, lighting, world
# generation) cross crate boundaries constantly and are worthless
# un-inlined. `panic = "abort"` drops the unwinding tables; nothing in
# the game catches a panic.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# The mesher and the lighting flood-fill are unusably slow unoptimised --
# a debug build spends more time meshing one chunk than it has in a whole
# frame. Optimising just the dependencies and the shared crate keeps
# `cargo run` debuggable where the game logic lives while making it
# playable.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.primitive_shared]
opt-level = 2

# Size over speed for the crates that only ever run at startup.
#
# `naga` compiles the four WGSL shaders once; `image` decodes fourteen
# 16x16 PNGs once; `toml` reads three config files once. None of them is
# on the frame path, so trading their inlining for smaller code costs
# nothing a player can measure. Everything actually hot -- the mesher,
# the lighting flood-fill, glam, wgpu's per-frame encoding -- stays at
# opt-level 3.
[profile.release.package.naga]
opt-level = "s"
[profile.release.package.image]
opt-level = "s"
[profile.release.package.png]
opt-level = "s"
[profile.release.package.toml]
opt-level = "s"
[profile.release.package.toml_edit]
opt-level = "s"
[profile.release.package.winit]
opt-level = "s"
