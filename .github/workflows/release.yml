# Builds the downloadable archives for a tagged release.
#
# Separate from `ci.yml` on purpose. CI answers "does this compile and
# pass" on every push and has to be fast; this answers "what do people
# download" and runs when a version is tagged. Sharing one workflow would
# mean either building release binaries on every branch push or shipping
# artifacts nobody asked for.
#
# Both platforms are built natively rather than cross-compiled. The
# client links a real graphics stack and winit's X11 headers on Linux;
# cross-compiling that from one host is a toolchain project of its own,
# and the two runners are free.
name: release

on:
  push:
    tags: ["v*"]
  # So a release can be rehearsed without tagging anything. The artifacts
  # come out identical; only the GitHub release step is skipped.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: pwsh -File package.ps1 -Zip
            archive: dist/primitive_win64.zip
          - os: ubuntu-latest
            script: bash package.sh --tar
            archive: dist/primitive_linux64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # winit is built X11-only, so the client needs the X11 headers, and
      # cpal reaches the sound card through ALSA, whose -sys crate finds
      # the library with pkg-config: without both the build dies in a
      # build script two minutes in. Needed to
      # link on Linux even though a packaged build may never open a
      # window on the machine that made it.
      - name: Install X11 and ALSA development headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libasound2-dev pkg-config

      - uses: Swatinem/rust-cache@v2

      # The archives are what players run, so they are built from a tree
      # that passed its own tests rather than from one that merely
      # compiled.
      # **A failure is written where it can be read without signing in.**
      # The job log of a public repository asks for an account; the run's
      # annotations do not. So every failing test and every panic is also
      # printed as an `::error::` line, and "the tests failed on the
      # runner" stops being a failure nobody can see the cause of.
      # `--no-fail-fast`: the first red binary used to hide every other one.
      - name: Test
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          set +e
          cargo test --workspace --no-fail-fast 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          # Windows writes CR LF, and `FAILED$` never matched a line ending
          # in a carriage return.
          tr -d '\r' < test.log > test.txt && mv test.txt test.log
          grep -E "^test .* FAILED$|panicked at|^error(\[|:)|process didn't exit|STATUS_" test.log | head -30 | while IFS= read -r line; do
            echo "::error::$line"
          done
          grep -A3 'panicked at' test.log | grep -v 'panicked at\|^--$\|RUST_BACKTRACE' | head -20 | while IFS= read -r line; do
            echo "::error::$line"
          done
          exit $status

      # **Which test it was.** A test binary that dies without a panic --
      # an exit code and nothing else, which is how a crash under a driver
      # looks -- names no test at all. Run again one test at a time, the
      # harness prints each name before it runs it, so the last line is
      # the one that took the process down.
      - name: Say which test broke
        if: failure()
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          grep -o 'to rerun pass `[^`]*`' test.log | sed 's/.*`\(.*\)`/\1/' | sort -u | while read -r args; do
            cargo test $args -- --test-threads=1 2>&1 | tr -d '\r' > one.log
            grep -E "^test .* FAILED$|panicked at" one.log | head -5 | while IFS= read -r l; do echo "::error::$args: $l"; done
            grep -A2 'panicked at' one.log | grep -v 'panicked at' | head -4 | while IFS= read -r l; do echo "::error::$l"; done
            tail -n 5 one.log | while IFS= read -r l; do echo "::warning::$args, last lines: $l"; done
          done

      - name: Package
        run: ${{ matrix.script }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      # Only for RELEASE_NOTES.md. The archives come from the package job;
      # the checkout is here because the notes live in the tagged tree,
      # next to the code they describe, rather than in a form on GitHub
      # that nobody reviews with the diff.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: RELEASE_NOTES.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*/*
          # The tag's own notes, written by hand from the CHANGELOG.
          # Generating them from commit subjects produces a list of
          # commit subjects, which is not what the CHANGELOG is for.
          # Not the CHANGELOG itself either: its release section is
          # thousands of lines of mechanism for whoever works on the game,
          # and the release page is read by whoever is about to play it.
          body_path: RELEASE_NOTES.md
          # Published at once: a tag is pushed only when the release is
          # meant, and a draft was one more click for a person to make
          # after every build that had already passed its own tests.
          draft: false
